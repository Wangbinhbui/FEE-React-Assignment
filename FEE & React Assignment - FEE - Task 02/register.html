<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register • Quizzes</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: #f8fafc;
      position: relative;
    }
    .auth-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }
    .auth-card {
      max-width: 500px;
      margin: 5vh auto;
      z-index: 1;
      position: relative;
    }
  </style>
</head>

<body>
  <img class="auth-bg" src="assert/image/background.png" alt="" aria-hidden="true">
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="auth-card card shadow-lg p-4 w-100" style="max-width: 500px;">
      <h1 class="mb-4 text-center">Register</h1>
      <form action="#" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="first-name" class="form-label">First Name</label>
            <input id="first-name" class="form-control" type="text" name="firstName" placeholder="Enter your first name" required>
          </div>
          <div class="col-md-6">
            <label for="last-name" class="form-label">Last Name</label>
            <input id="last-name" class="form-control" type="text" name="lastName" placeholder="Enter your last name" required>
          </div>
          <div class="col-12">
            <label for="email" class="form-label">Email Address</label>
            <input id="email" class="form-control" type="email" name="email" placeholder="Enter your email" required>
          </div>
          <div class="col-md-6">
            <label for="reg-username" class="form-label">Username</label>
            <input id="reg-username" class="form-control" type="text" name="username" placeholder="Enter your username" required>
          </div>
          <div class="col-md-6">
            <label for="phone" class="form-label">Phone Number</label>
            <input id="phone" class="form-control" type="tel" name="phone" placeholder="Enter your phone number">
          </div>
          <div class="col-md-6">
            <label for="reg-password" class="form-label">Password</label>
            <input id="reg-password" class="form-control" type="password" name="password" placeholder="Enter your password" required>
          </div>
          <div class="col-md-6">
            <label for="confirm" class="form-label">Confirm Password</label>
            <input id="confirm" class="form-control" type="password" name="confirmPassword" placeholder="Confirm your password" required>
          </div>
          <div class="col-12 d-flex justify-content-between align-items-center mt-3">
            <a class="btn btn-outline-secondary" href="homepage.html">Back to Home</a>
            <button class="btn btn-primary" type="submit">Register</button>
          </div>
        </div>
      </form>
      <div class="text-center mt-3">Already have an account? <a href="login.html">Login</a></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
