<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Quizzes</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: #f8fafc;
      position: relative;
    }
    .auth-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }
    .auth-card {
      max-width: 400px;
      margin: 5vh auto;
      z-index: 1;
      position: relative;
    }
  </style>
</head>

<body>
  <img class="auth-bg" src="assert/image/background.png" alt="" aria-hidden="true">
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="auth-card card shadow-lg p-4 w-100" style="max-width: 400px;">
      <h1 class="mb-4 text-center">Login</h1>
      <form action="#" method="post">
        <div class="mb-3">
          <label for="login-username" class="form-label">Username</label>
          <input id="login-username" class="form-control" type="text" name="username" placeholder="Enter your username" required>
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label">Password</label>
          <input id="login-password" class="form-control" type="password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a class="btn btn-outline-secondary" href="homepage.html">Back to Home</a>
          <button class="btn btn-primary" type="submit">Login</button>
        </div>
      </form>
      <div class="text-center mb-2"><a href="#">Forgot password?</a></div>
      <div class="text-center">Don't have an account? <a href="register.html">Register</a></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
