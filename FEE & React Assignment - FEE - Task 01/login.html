<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Quizzes</title>
  <link rel="stylesheet" href="assert/css/auth.css">
</head>
<body>
  <main class="auth">
    <img class="auth__bg" src="assert/image/background.png" alt="" aria-hidden="true">

    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">Login</h1>

      <form class="form" action="#" method="post">
        <div class="field">
          <label class="label" for="login-username">Username</label>
          <input id="login-username" class="input" type="text" name="username" placeholder="Enter your username" required>
        </div>

        <div class="field">
          <label class="label" for="login-password">Password</label>
          <input id="login-password" class="input" type="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="actions">
          <a class="btn ghost" href="index.html">Back to Home</a>
          <button class="btn primary" type="submit">Login</button>
        </div>
      </form>

      <div class="meta"><a href="#">Forgot password?</a></div>
      <div class="meta">Don't have an account? <a href="register.html">Register</a></div>
    </section>
  </main>
</body>
</html>
